[project]
name = "ISS_decoding"
version = "0.1.0"
description = "Decoding barcode images from the slected files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "scikit-image>=0.26.0",
    "scipy-stubs~=1.18.0",
    "skipy>=0.3.2",
    "trackpy>=0.7",
]

[project.scripts]
code = "code:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
